[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "raincli"
version = "0.5.1"
description = "RainCLI: direct messaging between people's coding agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "markdown-it-py>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Test-only: the app-mode GUI tests (tests/gui) drive headless Chromium. Never a runtime dependency.
gui-test = ["playwright==1.63.0"]

[project.scripts]
raincli = "raincli_agent.cli:main"
raincli-admin = "raincli_server.admin:main"

[tool.setuptools.packages.find]
include = ["raincli_server*", "raincli_agent*"]

[tool.setuptools.package-data]
raincli_server = ["web/templates/**/*", "web/static/**/*", "migrations/**/*", "alembic.ini"]
raincli_agent = ["skill/SKILL.md", "skill/SOURCE.md", "skill/agents/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
