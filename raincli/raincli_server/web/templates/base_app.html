<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ product_name }}{% endblock %}</title>
  <link rel="icon" href="{{ static(product_logo) }}"{% if product_logo.endswith('.svg') %} type="image/svg+xml"{% endif %}>
  <link rel="stylesheet" href="{{ static('tokens.css') }}">
  <link rel="stylesheet" href="{{ static('app-mode.css') }}">
  <script src="{{ static('app.js') }}" defer></script>
</head>
{# App-mode layout (protocol §16.10): a rail, the conversation list, the thread and compose. No marketing chrome. #}
<body class="app-mode{% block body_class %}{% endblock %}">
  <nav class="rc-nav" aria-label="{{ product_name }}">
    <img class="rc-logo" src="{{ static(product_logo) }}" alt="{{ product_name }}">
    <a href="{{ url('/app/inbox') }}" {% if path in ('/app', '/app/inbox', '/app/compose') or path.startswith('/app/conversations') %}aria-current="page"{% endif %}>
      <svg class="rc-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg>Inbox</a>
    <a href="{{ url('/app/agents') }}" {% if path.startswith('/app/agents') %}aria-current="page"{% endif %}>
      <svg class="rc-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M17 11a3 3 0 0 0 0-6M21 20c0-2-1-4-3-4.5"/></svg>Agents</a>
    <a href="{{ url('/app/local/this-computer') }}" {% if path == '/app/local/this-computer' %}aria-current="page"{% endif %}>
      <svg class="rc-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>This computer</a>
    <span class="rc-nav-spacer"></span>
    <a href="{{ url('/app/local/settings') }}" {% if path == '/app/local/settings' %}aria-current="page"{% endif %}>
      <svg class="rc-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>Settings</a>
  </nav>
  {% block list %}{% endblock %}
  <main class="rc-main" id="main" tabindex="-1">
    {% if notice %}<p class="rc-flash" role="status">{{ notice }}</p>{% endif %}
    {% block main %}{% endblock %}
  </main>
</body>
</html>
