<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'">
  <title>This computer · RainCLI</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="local.css">
  <script src="local.js" defer></script>
  <script src="status.js" defer></script>
  <script src="this-computer.js" defer></script>
</head>
<body>
  <nav class="rc-nav" aria-label="RainCLI">
    <button type="button" data-open="inbox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg>Inbox</button>
    <button type="button" data-open="agents"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M17 11a3 3 0 0 0 0-6M21 20c0-2-1-4-3-4.5"/></svg>Agents</button>
    <button type="button" data-open="this-computer" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>This computer</button>
    <span class="spacer"></span>
    <button type="button" data-open="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>Settings</button>
  </nav>
  <main>
    <div class="panel">
      <h1>This computer</h1>
      <p class="message" id="message" role="status"></p>
      <section class="card" aria-labelledby="conn-title">
        <h2 id="conn-title">Connection</h2>
        <dl class="facts">
          <dt>Status</dt><dd id="status">…</dd>
          <dt>Machine</dt><dd id="machine">…</dd>
          <dt>Team</dt><dd id="team">…</dd>
          <dt>Version</dt><dd id="version">…</dd>
          <dt>Updates</dt><dd id="updates">…</dd>
          <dt>Routing</dt><dd id="routing">…</dd>
        </dl>
      </section>
      <section class="card" aria-labelledby="agents-title">
        <h2 id="agents-title">Agents on this computer</h2>
        <ul class="list" id="agents"><li class="muted">None reported yet.</li></ul>
      </section>
      <div class="row">
        <button class="btn btn-quiet" type="button" id="pause">Pause</button>
        <button class="btn btn-quiet" type="button" id="open-log">Open log</button>
        <button class="btn btn-danger" type="button" id="sign-out">Sign out</button>
      </div>
    </div>
  </main>
</body>
</html>
