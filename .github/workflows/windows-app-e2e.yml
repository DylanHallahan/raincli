name: Manual Windows app e2e
# Builds two installers from the dispatched ref, the same source as 0.4.0 and as 0.4.1, then
# runs scripts/windows-app-e2e.py on this disposable runner: a silent per-user install, sign-in
# through `raincli login` on a pseudo console, the Run value, a pushed upgrade and downgrade
# through the installer assets, sign-out and uninstall, and migration of a pip-installed v0.2.0
# client with a connector config and queue. The server is a throwaway one started in the job.
# The release assets come from a fake endpoint on the REAL GitHub hostnames, reached through a
# hosts-file entry and a test root CA in this runner's trust store (protocol §15.8 M11): the
# shipped client has no override. No secrets, no production server, no release is touched.
# Manual only; read-only token.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app-e2e:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install the pinned build and e2e tools (hash-checked wheels only)
        run: 'python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r packaging/windows/requirements-build.txt -r packaging/windows/requirements-e2e.txt'
      - name: Build the 0.4.0 and 0.4.1 test installers from this ref
        env:
          PYTHONUTF8: '1'
        run: |
          python packaging/windows/build.py --version 0.4.0 --work build/e2e-0.4.0 --out dist/e2e
          python packaging/windows/build.py --version 0.4.1 --work build/e2e-0.4.1 --out dist/e2e
      - name: Install, sign in, update, downgrade, migrate and uninstall
        env:
          PYTHONUTF8: '1'
        # The image's PostgreSQL (PGBIN) runs as a fresh initdb cluster on a random loopback port.
        run: python scripts/windows-app-e2e.py --installers dist/e2e
