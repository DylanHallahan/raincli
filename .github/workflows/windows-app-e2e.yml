name: Manual Windows app e2e
# Builds two installers from the dispatched ref, the same source as OLD and as NEW (versions derived from the
# source by scripts/e2e_versions.py), then runs scripts/windows-app-e2e.py on this disposable runner (it also
# builds a BROKEN rollback
# installer from a patched staging copy): a silent per-user install, sign-in
# through `raincli login` on a pseudo console, the Run value, a pushed upgrade and downgrade
# through the installer assets, sign-out and uninstall, and migration of a pip-installed v0.2.0
# client with a connector config and queue, and of a managed v0.3.2 install. The server is a
# throwaway one started in the job.
# The release assets come from a fake endpoint on the REAL GitHub hostnames, reached through a
# hosts-file entry and a test root CA in this runner's trust store (protocol §15.8 M11): the
# shipped client has no override. No secrets, no production server, no release is touched.
# With real_from and real_to set (for example v0.4.0 and v0.4.1), it builds nothing and uses the
# installer assets attached to those published releases instead, through real GitHub.
# Manual only; read-only token.
on:
  workflow_dispatch:
    inputs:
      real_from:
        description: Published release to install first (vX.Y.Z >= v0.4.0); empty builds test installers instead
        required: false
        default: ''
      real_to:
        description: Published release to push (newer than real_from); used only with real_from
        required: false
        default: ''
      only:
        description: Run only one part on this ref's test installers (groups-shots, part G); empty runs everything
        type: choice
        options: ['', 'groups-shots']
        required: false
        default: ''
permissions:
  contents: read
jobs:
  app-e2e:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Install the pinned build and e2e tools (hash-checked wheels only)
        run: 'python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r packaging/windows/requirements-build.txt -r packaging/windows/requirements-e2e.txt'
      # pywebview for the app window; proxy_tools is a source archive, built with the pinned setuptools above.
      - name: Install pywebview (hash-checked, no dependency resolution, no build isolation)
        run: 'python -m pip install --disable-pip-version-check --require-hashes --no-deps --no-build-isolation -r packaging/windows/requirements-webview.txt'
      # The test versions come from the source (scripts/e2e_versions.py): the larger of its version and its
      # MIN_SAFE_VERSION, then one patch above it for the update (the script builds the broken one at two above),
      # so the client never refuses a target as below its minimum safe version or the v0.5.0 floor (§16.12 C1).
      - name: Work out the test versions from this ref
        id: versions
        if: inputs.real_from == ''
        run: python scripts/e2e_versions.py --github-output
      - name: Build the OLD and NEW test installers from this ref
        if: inputs.real_from == ''
        env:
          PYTHONUTF8: '1'
          OLD: ${{ steps.versions.outputs.old }}
          NEW: ${{ steps.versions.outputs.new }}
        shell: pwsh
        run: |
          python packaging/windows/build.py --version "$env:OLD" --work "build/e2e-$env:OLD" --out dist/e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/windows/build.py --version "$env:NEW" --work "build/e2e-$env:NEW" --out dist/e2e
      - name: Install, sign in, update, downgrade, migrate and uninstall (test installers)
        if: inputs.real_from == ''
        env:
          PYTHONUTF8: '1'
          # Only for the e2e's own api.github.com setup lookups (the unauthenticated limit is shared per runner IP);
          # the script removes it from its environment first, so nothing it launches inherits it.
          RAINCLI_E2E_GITHUB_TOKEN: ${{ github.token }}
          # The input reaches the script as data, never as shell text; argparse allows only its one choice.
          ONLY: ${{ inputs.only }}
        # The image's PostgreSQL (PGBIN) runs as a fresh initdb cluster on a random loopback port.
        shell: pwsh
        run: |
          if ($env:ONLY) { python scripts/windows-app-e2e.py --installers dist/e2e --only "$env:ONLY" }
          else { python scripts/windows-app-e2e.py --installers dist/e2e }
          exit $LASTEXITCODE
      - name: Install, sign in, update, downgrade, migrate and uninstall (published release assets)
        if: inputs.real_from != ''
        env:
          PYTHONUTF8: '1'
          RAINCLI_E2E_GITHUB_TOKEN: ${{ github.token }}
          # Inputs reach the script as data, never as shell text; it validates the tags.
          REAL_FROM: ${{ inputs.real_from }}
          REAL_TO: ${{ inputs.real_to }}
        shell: pwsh
        run: python scripts/windows-app-e2e.py --real "$env:REAL_FROM" "$env:REAL_TO"
      # The app window's GUI checks (part D) save their screenshots here.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: app-window-screenshots
          path: build/e2e-artifacts
          if-no-files-found: warn
          retention-days: 14
