# /etc/nginx/sites-available/raincli.com.conf -- RainCLI site AND agent API at https://raincli.com
# Replaces the existing raincli.com server blocks (back them up first; see docs/raincli-deploy.md).
# KEEP the host's existing, verified certificate paths: copy its ssl_certificate lines over the two below.
# Works with Nginx >= 1.18 (uses "listen ... ssl http2", not the 1.25.1+ "http2 on" directive).

server {
    listen 80;
    listen [::]:80;
    server_name raincli.com www.raincli.com;
    server_tokens off;
    access_log /var/log/nginx/raincli.access.log raincli_main;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://raincli.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.raincli.com;
    server_tokens off;
    access_log /var/log/nginx/raincli.access.log raincli_main;
    ssl_certificate     /etc/letsencrypt/live/raincli.com/fullchain.pem;   # replace with the existing lines
    ssl_certificate_key /etc/letsencrypt/live/raincli.com/privkey.pem;
    return 301 https://raincli.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name raincli.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/raincli.com/fullchain.pem;   # replace with the existing lines
    ssl_certificate_key /etc/letsencrypt/live/raincli.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn raincli_conn 40;
    limit_req_status 429;

    # raincli_main (raincli-http.conf) is "combined" with the app install token redacted from the
    # User-Agent (§16.14 S3). It logs the request line but never the Authorization header.
    # Invitation URLs carry a single-use secret in the path, so they are never logged (below).
    access_log /var/log/nginx/raincli.access.log raincli_main;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Long-poll inbox: the app waits up to 25 s.
    location = /api/v1/inbox {
        limit_req zone=raincli_api burst=20 nodelay;
        proxy_buffering off;
        proxy_read_timeout 45s;
        proxy_pass http://raincli_app;
    }

    # The person inbox long-polls like the agent inbox (protocol §16.4).
    location = /api/v1/person/inbox {
        limit_req zone=raincli_api burst=20 nodelay;
        proxy_buffering off;
        proxy_read_timeout 45s;
        proxy_pass http://raincli_app;
    }

    # Person sends take the same attachments as agent sends (§16.4); the app enforces 2 MiB.
    location = /api/v1/person/send {
        limit_req zone=raincli_api burst=20 nodelay;
        client_max_body_size 2m;
        proxy_pass http://raincli_app;
    }

    # §16.12 C3: the handoff code is in the query string, so log the path only, and keep error lines
    # (which quote the request) out of the main log.
    location = /app/handoff {
        access_log /var/log/nginx/raincli.access.log raincli_noquery;
        error_log /var/log/nginx/raincli-handoff-error.log crit;
        limit_req zone=raincli_login burst=5 nodelay;
        proxy_pass http://raincli_app;
    }

    # Send accepts up to 5 Markdown attachments (1 MiB raw, base64 in JSON); the app enforces 2 MiB.
    location = /api/v1/messages {
        limit_req zone=raincli_api burst=20 nodelay;
        client_max_body_size 2m;
        proxy_pass http://raincli_app;
    }

    # Presence reports carry the machine's agent directory (up to 100 agents, about 95 KB at most);
    # the app enforces 128 KiB on PUT /api/v1/presence and 64 KiB on every other method there.
    location = /api/v1/presence {
        limit_req zone=raincli_api burst=40 nodelay;
        client_max_body_size 128k;
        proxy_pass http://raincli_app;
    }

    location /api/ {
        limit_req zone=raincli_api burst=40 nodelay;
        proxy_pass http://raincli_app;
    }

    # Web compose form uploads .md attachments (multipart); the app enforces 2 MiB.
    location ~ ^/app/conversations/[^/]+/send$ {
        limit_req zone=raincli_web burst=10 nodelay;
        client_max_body_size 2m;
        proxy_pass http://raincli_app;
    }

    location = /login {
        limit_req zone=raincli_login burst=5 nodelay;
        proxy_pass http://raincli_app;
    }

    location ^~ /invite/ {
        access_log off;
        error_log /var/log/nginx/raincli-invite-error.log crit;   # 429/502 lines would include the token
        limit_req zone=raincli_login burst=5 nodelay;
        proxy_pass http://raincli_app;
    }

    location / {
        limit_req zone=raincli_web burst=30 nodelay;
        proxy_pass http://raincli_app;
    }
}
