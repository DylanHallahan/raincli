# /etc/nginx/conf.d/raincli-http.conf -- http{}-level definitions (rate-limit zones, upstream).
limit_req_zone $binary_remote_addr zone=raincli_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=raincli_web:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=raincli_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=raincli_conn:10m;

upstream raincli_app {
    server 127.0.0.1:8300;
    keepalive 16;
}

# §16.12 C3: the app handoff carries a single-use code in its query string. Log its path only.
log_format raincli_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent "-" "$http_user_agent"';
