# /etc/nginx/conf.d/raincli-http.conf -- http{}-level definitions (rate-limit zones, upstream).
limit_req_zone $binary_remote_addr zone=raincli_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=raincli_web:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=raincli_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=raincli_conn:10m;

upstream raincli_app {
    server 127.0.0.1:8300;
    keepalive 16;
}

# §16.14 S3: the app's webview sends "RainCLIApp/<app install token>" in its User-Agent. That token must
# never reach a log: every RainCLI format logs $raincli_user_agent, which keeps the text before the first
# "RainCLIApp/" (any case) and replaces the rest with "RainCLIApp/[redacted]". Never log $http_user_agent.
map $http_user_agent $raincli_user_agent {
    "~*^(?<raincli_ua_head>.*?)RainCLIApp/"  "${raincli_ua_head}RainCLIApp/[redacted]";
    default                                  $http_user_agent;
}

# "combined" with the redacted User-Agent.
log_format raincli_main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                        '"$http_referer" "$raincli_user_agent"';

# §16.12 C3: the app handoff carries a single-use code in its query string. Log its path only.
log_format raincli_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent "-" "$raincli_user_agent"';
